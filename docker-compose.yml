services:
  apigatewaymedilabo:
    image: apigatewaymedilabo
    ports:
      - "32768:8080"
    build: "./APIGatewayMediLabo/"
    networks:
      - medilabo-network
      
  apiauthenticationmedilabo:
    image: apiauthenticationmedilabo
    ports:
      - "32771:8080"
    depends_on:
      - apigatewaymedilabo
      # - sqlserver
    build: "./APIAuthenticationMedilabo/"
    volumes: 
        - dataPatients:/app/dataPatients
    networks:
      - medilabo-network

  apiinformationspatient:
    image: apiinformationspatient
    ports:
      - "32769:8080"
    depends_on:
      - apigatewaymedilabo
      - apiauthenticationmedilabo 
      # - sqlserver
    build: "./APIInformationsPatient/"
    volumes: 
        - dataPatients:/app/dataPatients
    networks:
      - medilabo-network

  frontpatient:
    image: frontpatient
    ports:
      - "32770:8080"
    depends_on:
      - apigatewaymedilabo
      - apiinformationspatient
    build: "./FrontPatient/"
    networks:
      - medilabo-network

